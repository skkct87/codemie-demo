<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tour Booking - One Page App</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fb; margin:0; }
    header { background:#0b5ed7; color:#fff; padding:18px 16px; }
    header h1 { margin:0; font-size:20px; }
    .container { max-width: 980px; margin: 18px auto; padding: 0 16px; }
    .grid { display:grid; grid-template-columns: 1.2fr .8fr; gap:16px; }
    .card { background:#fff; border:1px solid #e6e6e6; border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(16,24,40,0.1), 0 1px 2px rgba(16,24,40,0.06); }
    .card h2 { margin:0 0 10px; font-size:18px; }
    label { display:block; margin-top:10px; font-size:14px; }
    input, select, textarea {
      width:100%; box-sizing:border-box; padding:10px; margin-top:6px;
      border:1px solid #d8d8d8; border-radius:10px; font-size:14px;
    }
    textarea { min-height: 80px; resize: vertical; }
    .date-field { position:relative; margin-top:6px; }
    .date-field input { margin-top:0; }
    .date-field #date { padding-right:44px; }
    .date-field input[aria-invalid="true"] { border-color:#b42318; }
    .date-picker-btn {
      position:absolute; top:0; right:0; bottom:0; width:42px; padding:0; border:0;
      border-radius:0 10px 10px 0; background:transparent; color:#0b5ed7; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .date-field .date-native {
      position:absolute; left:0; bottom:0; width:100%; height:1px; padding:0; border:0;
      opacity:0; pointer-events:none;
    }
    .error-text { color:#b42318; font-size:13px; margin-top:8px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .btn { border:none; border-radius:10px; padding:10px 12px; cursor:pointer; font-weight:600; }
    .btn-primary { background:#0b5ed7; color:#fff; }
    .btn-outline { background:#fff; border:1px solid #0b5ed7; color:#0b5ed7; }
    .muted { color:#666; font-size:13px; }
    .small { font-size:12px; margin:6px 0 0; }
    .summary { background:#f8fafc; border:1px dashed #cbd5e1; padding:12px; border-radius:12px; }
    .price { font-size:22px; font-weight:800; margin:6px 0 0; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#e9f2ff; color:#0b5ed7; font-size:12px; }
    .box { margin-top:12px; padding:12px; border-radius:12px; border:1px solid #e6e6e6; background:#fff; box-shadow:0 1px 3px rgba(16,24,40,0.1), 0 1px 2px rgba(16,24,40,0.06); }
    footer { text-align:center; padding:16px; color:#666; font-size:12px; }
    @media (max-width: 860px){ .grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Tour Booking (One Page Application)</h1>
  </header>

  <div class="container">
    <div class="grid">

      <!-- Left: Booking Form -->
      <div class="card">
        <h2>Book Your Tour</h2>
        <p class="muted">Fill details and confirm booking.</p>

        <div class="row">
          <div>
            <label>Full Name</label>
            <input id="name" type="text" placeholder="Enter your name" />
          </div>
          <div>
            <label>Mobile</label>
            <input id="mobile" type="tel" placeholder="e.g. 9876543210" />
          </div>
        </div>

        <div class="row">
          <div>
            <label>Email</label>
            <input id="email" type="email" placeholder="Enter email" />
          </div>
          <div>
            <label>Tour Package</label>
            <select id="package">
              <option value="goa">Goa Getaway (3 Days)</option>
              <option value="kerala">Kerala Backwaters (5 Days)</option>
              <option value="manali">Manali Adventure (4 Days)</option>
              <option value="rajasthan">Rajasthan Heritage (6 Days)</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="date">Travel Date</label>
            <div class="date-field">
              <input id="date" type="text" inputmode="numeric" autocomplete="off" placeholder="dd-mm-yyyy" maxlength="10" />
              <button type="button" class="date-picker-btn" id="datePickerBtn" aria-label="Open calendar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </button>
              <input id="datePicker" class="date-native" type="date" tabindex="-1" aria-hidden="true" />
            </div>
            <div id="dateError" class="error-text" role="alert" hidden></div>
          </div>
          <div>
            <label>Travellers</label>
            <input id="travellers" type="number" min="1" value="1" />
          </div>
        </div>

        <label>Notes (optional)</label>
        <textarea id="notes" placeholder="Pickup city, hotel preference, etc."></textarea>

        <button class="btn btn-primary" id="bookBtn" type="button">Confirm Booking</button>
        <button class="btn btn-outline" id="resetBtn" type="button" style="margin-left:8px;">Reset</button>

        <div id="message" style="margin-top:12px;"></div>
      </div>

      <!-- Right: Summary -->
      <div class="card">
        <h2>Tour Summary</h2>

        <div class="summary">
          <div class="pill" id="pkgLabel">Goa Getaway (3 Days)</div>
          <div class="price" id="price">₹ 8,999</div>
          <div class="muted" id="calcText">For 1 traveller</div>
        </div>

        <div class="box">
          <h3 style="margin:0 0 8px;">Support</h3>
          <div class="muted">Working hours: 9:00 AM – 7:00 PM</div>
          <div class="muted">Email: tours@example.com</div>
        </div>

        <div class="box">
          <h3 style="margin:0 0 8px;">Download Brochure</h3>
          <button class="btn btn-primary" id="downloadBrochureBtn" type="button">Download Brochure</button>
          <p class="muted small">Download brochure</p>
        </div>
      </div>

    </div>
  </div>

  <footer>© Tour Booking - Single Page Demo</footer>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script>
    const pkgSelect = document.getElementById("package");
    const travellersInput = document.getElementById("travellers");
    const pkgLabel = document.getElementById("pkgLabel");
    const priceEl = document.getElementById("price");
    const calcText = document.getElementById("calcText");
    const message = document.getElementById("message");

    const packages = {
      goa:       { name: "Goa Getaway (3 Days)", price: 8999 },
      kerala:    { name: "Kerala Backwaters (5 Days)", price: 15999 },
      manali:    { name: "Manali Adventure (4 Days)", price: 12999 },
      rajasthan: { name: "Rajasthan Heritage (6 Days)", price: 21999 }
    };

    function formatINR(n){ return "₹ " + n.toLocaleString("en-IN"); }

    function updateSummary(){
      const key = pkgSelect.value;
      const t = Math.max(1, parseInt(travellersInput.value || "1", 10));
      travellersInput.value = t;

      const pkg = packages[key];
      const total = pkg.price * t;

      pkgLabel.textContent = pkg.name;
      priceEl.textContent = formatINR(total);
      calcText.textContent = `For ${t} traveller${t > 1 ? "s" : ""}`;
    }

    const dateInput = document.getElementById("date");
    const datePicker = document.getElementById("datePicker");
    const datePickerBtn = document.getElementById("datePickerBtn");
    const dateError = document.getElementById("dateError");

    // Keep in sync with src/lib/travelDate.ts
    const DATE_FORMAT_ERROR = "Enter the travel date in dd-mm-yyyy format.";
    const DATE_INVALID_ERROR = "Enter a valid date.";
    const DATE_PAST_ERROR = "Travel date cannot be in the past.";

    function pad(n, width){ return String(n).padStart(width, "0"); }

    function todayIso(){
      const now = new Date();
      return `${pad(now.getFullYear(), 4)}-${pad(now.getMonth() + 1, 2)}-${pad(now.getDate(), 2)}`;
    }

    function daysInMonth(year, month){
      if(month === 2){
        const leap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
        return leap ? 29 : 28;
      }
      return [4, 6, 9, 11].includes(month) ? 30 : 31;
    }

    function parseTravelDate(text){
      const match = /^(\d{2})-(\d{2})-(\d{4})$/.exec(text.trim());
      if(!match) return { ok:false, error:DATE_FORMAT_ERROR };

      const day = Number(match[1]);
      const month = Number(match[2]);
      const year = Number(match[3]);
      if(year < 1 || month < 1 || month > 12 || day < 1 || day > daysInMonth(year, month)){
        return { ok:false, error:DATE_INVALID_ERROR };
      }

      const iso = `${match[3]}-${match[2]}-${match[1]}`;
      if(iso < todayIso()) return { ok:false, error:DATE_PAST_ERROR };
      return { ok:true, iso };
    }

    function showDateError(text){
      dateError.textContent = text || "";
      dateError.hidden = !text;
      if(text){
        dateInput.setAttribute("aria-invalid", "true");
        dateInput.setAttribute("aria-describedby", "dateError");
      } else {
        dateInput.removeAttribute("aria-invalid");
        dateInput.removeAttribute("aria-describedby");
      }
    }

    datePicker.min = todayIso();

    dateInput.addEventListener("input", () => {
      const result = parseTravelDate(dateInput.value);
      datePicker.value = result.ok ? result.iso : "";
      if(result.ok) showDateError("");
    });

    dateInput.addEventListener("blur", () => {
      if(!dateInput.value.trim()){ showDateError(""); return; }
      const result = parseTravelDate(dateInput.value);
      showDateError(result.ok ? "" : result.error);
    });

    datePickerBtn.addEventListener("click", () => {
      datePicker.min = todayIso();
      if(typeof datePicker.showPicker === "function") datePicker.showPicker();
      else datePicker.focus();
    });

    datePicker.addEventListener("change", () => {
      if(!datePicker.value) return;
      const [year, month, day] = datePicker.value.split("-");
      dateInput.value = `${day}-${month}-${year}`;
      dateInput.dispatchEvent(new Event("input", { bubbles: true }));
    });

    document.getElementById("bookBtn").addEventListener("click", () => {
      const name = document.getElementById("name").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const email = document.getElementById("email").value.trim();
      const date = dateInput.value.trim();

      const dateResult = parseTravelDate(date);
      if(date && !dateResult.ok){
        showDateError(dateResult.error);
        message.innerHTML = "";
        return;
      }

      if(!name || !mobile || !email || !date){
        message.innerHTML = `<div style="color:#b42318;">Please fill Name, Mobile, Email, and Travel Date.</div>`;
        return;
      }

      const pkg = packages[pkgSelect.value].name;
      const travellers = travellersInput.value;

      const confirmed = document.createElement("div");
      confirmed.style.color = "#067647";
      confirmed.style.fontWeight = "700";
      confirmed.textContent = "Booking Confirmed";

      const details = [`Package: ${pkg}`, `Travellers: ${travellers}`, `Travel Date: ${date}`].map(text => {
        const line = document.createElement("div");
        line.className = "muted";
        line.textContent = text;
        return line;
      });

      message.replaceChildren(confirmed, ...details);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      document.querySelectorAll("input, textarea").forEach(el => {
        if(el.type === "number") el.value = 1;
        else el.value = "";
      });
      pkgSelect.value = "goa";
      message.innerHTML = "";
      showDateError("");
      updateSummary();
    });

    pkgSelect.addEventListener("change", updateSummary);
    travellersInput.addEventListener("input", updateSummary);
    updateSummary();

    document.getElementById("downloadBrochureBtn").addEventListener("click", () => {
      const key = pkgSelect.value;
      const pkg = packages[key];
      const travellers = Math.max(1, parseInt(travellersInput.value || "1", 10));
      const total = pkg.price * travellers;

      const lines = [
        `Package: ${pkg.name}`,
        `Travellers: ${travellers}`,
        `Price per traveller: ${formatINR(pkg.price)}`,
        `Total price: ${formatINR(total)}`,
        "",
        "Support",
        "Working hours: 9:00 AM - 7:00 PM",
        "Email: tours@example.com",
      ];

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(18);
      doc.text("Tour Brochure", 14, 20);

      doc.setFontSize(12);
      let y = 35;
      for (const line of lines) {
        doc.text(line, 14, y);
        y += 8;
      }

      const blob = doc.output("blob");
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "tour-brochure.pdf";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
